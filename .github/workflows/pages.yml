name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'example/**'
      - 'storybook/**'
      - 'src/**/*.stories.tsx'
  workflow_run:
    workflows:
      - Release Package
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

# Publishing to the gh-pages branch needs write access to repo contents.
# (PR previews live in the same branch under pr-preview/ — see pr-preview.yml —
# so this job must NOT wipe that directory when it redeploys the main site.)
permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install FFMpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build

      - name: Build example app
        working-directory: example
        run: pnpm exec vite build --base /

      - name: Build Storybook
        run: pnpm --filter classicy-storybook build

      - name: Merge Storybook into the site
        run: |
          mv storybook/storybook-static example/dist/storybook
          cp -r assets/. example/dist/assets/

      - name: Deploy to the gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: example/dist
          # Keep per-PR previews (published by pr-preview.yml) intact when the
          # main site redeploys. Everything else at the root is replaced.
          clean: true
          clean-exclude: |
            pr-preview/
