name: Release Package

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'assets/**'
      # The Platinum package lives under packages/, so a change only there
      # still releases (plan 0014-ahm).
      - 'packages/**'
      - '!**/*.stories.tsx'
      # Build config changes the published artifact just as much as source
      # does. Both 0.70.1 and 0.70.2 were vite.config.ts-only fixes for
      # consumer-breaking bugs and neither triggered a release -- they had to
      # be dispatched by hand, which is exactly the step a hotfix skips.
      - 'vite.config.ts'
      - 'bin/**'
      # NOT package.json: this workflow commits its own version bump, and
      # `gh-action-bump-version` does NOT add [skip ci] to it (only the
      # follow-up codename commit carries the tag). Listing package.json here
      # would make every release retrigger the release. Verified against the
      # 0.70.0/0.70.1 bump commits.
  workflow_dispatch:
    inputs:
      version-type:
        description: 'Override the version bump (major, minor, patch, ...). Empty: read it from the commit messages.'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - major
          - minor
          - patch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    # Pinned: the distro ffmpeg (8.0.1 here) builds the audio sprites and must not change with ubuntu-latest; revisit when 26.04 nears retirement.
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        id: checkout-code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        id: setup-pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        id: setup-node-js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        id: install-deps
        run: pnpm install --frozen-lockfile

      - name: Install FFMpeg
        id: setup-ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Tests
        id: run-tests
        run: pnpm test

      - name: Build Package
        id: build-package
        run: pnpm build

      - name: Bump version and push tag
        id: bump_version
        uses: phips28/gh-action-bump-version@master
        with:
          target-branch: main
          tag-prefix:  'v'
          default: patch
          # Pinned to the action's defaults (v12.0.2, 63bc5b9) so the 3.0.0
          # keyword is explicit: "BREAKING CHANGE" or "major" anywhere in any
          # commit of the push, or a `type!:` subject, makes it a major bump.
          major-wording: 'BREAKING CHANGE,major'
          # Manual runs: a non-empty input replaces the commit-message logic.
          version-type: ${{ inputs.version-type }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Use newTag output'
        run: echo "New version tag is ${{ steps.bump_version.outputs.newTag }}"

      # The Platinum package ships at the root's version (lockstep). The bump
      # action only edits the root package.json, so copy the number across and
      # commit it [skip ci] like the codename. Skipped until the package exists.
      - name: Sync the Platinum package version
        if: steps.bump_version.outputs.newTag != '' && hashFiles('packages/appearance/platinum/package.json') != ''
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          npm pkg set version="$VERSION" --prefix packages/appearance/platinum
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add packages/appearance/platinum/package.json
          git commit -m "ci: set @classicy/appearance-platinum to $VERSION [skip ci]"
          git push

      - name: Select release codename
        if: steps.bump_version.outputs.newTag != ''
        id: codename
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t NAMES < .github/release-codenames.txt

          USED_NAMES=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json name --jq '.[].name')

          CODENAME=""
          for name in "${NAMES[@]}"; do
            if ! echo "$USED_NAMES" | grep -qxF "$name"; then
              CODENAME="$name"
              break
            fi
          done

          if [ -z "$CODENAME" ]; then
            CODENAME="${{ steps.bump_version.outputs.newTag }}"
          fi

          echo "name=$CODENAME" >> "$GITHUB_OUTPUT"

      - name: Update release codename in package.json
        if: steps.bump_version.outputs.newTag != '' && steps.codename.outputs.name != ''
        run: |
          pnpm pkg set release="${{ steps.codename.outputs.name }}"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add package.json
          git commit -m "ci: set release codename to ${{ steps.codename.outputs.name }} [skip ci]"
          git push

      - name: Create GitHub Release
        if: steps.bump_version.outputs.newTag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump_version.outputs.newTag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.codename.outputs.name }}" \
            --generate-notes

      # pnpm, not the JS-DevTools action: only pnpm rewrites the Platinum
      # package's `workspace:^` peer range to a real `^<version>`. The token
      # reaches pnpm through the .npmrc setup-node writes (registry-url).
      - name: Publish to npm
        if: steps.bump_version.outputs.newTag != '' && hashFiles('packages/appearance/platinum/package.json') != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --filter @classicy/classicy --filter @classicy/appearance-platinum --access public --no-git-checks

      # Until the Platinum package exists, only the root publishes.
      - name: Publish to npm (core only)
        if: steps.bump_version.outputs.newTag != '' && hashFiles('packages/appearance/platinum/package.json') == ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --no-git-checks

      # The registry lists a new version several minutes after the publish
      # call returns (2.0.0 and 2.0.1 each took 8–10 minutes), and npm-publish
      # can log "already published" even when the publish went through. The
      # downstream bumps install `latest`, so dispatching before the version is
      # listed pulls in the PREVIOUS release (rt911#598 bumped to 2.0.0 for
      # v2.0.1). Wait until `latest` really is this version.
      - name: Wait for the release to appear on npm
        if: steps.bump_version.outputs.newTag != ''
        env:
          TAG: ${{ steps.bump_version.outputs.newTag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PACKAGES=("$(node -p 'require("./package.json").name')")
          if [ -f packages/appearance/platinum/package.json ]; then
            PACKAGES+=("$(node -p 'require("./packages/appearance/platinum/package.json").name')")
          fi
          # Both packages must be listed before anything downstream runs.
          for NAME in "${PACKAGES[@]}"; do
            LIVE=""
            for attempt in $(seq 1 60); do
              LATEST="$(npm view "$NAME" dist-tags.latest --prefer-online 2>/dev/null || true)"
              if [ "$LATEST" = "$VERSION" ]; then
                echo "$NAME@$VERSION is live on npm (attempt $attempt)."
                LIVE=1
                break
              fi
              echo "Waiting for $NAME@$VERSION on npm (latest: ${LATEST:-none}), attempt $attempt/60"
              sleep 30
            done
            if [ -z "$LIVE" ]; then
              echo "::error::$NAME@$VERSION was not listed as latest on npm within 30 minutes; not dispatching downstream deploys."
              exit 1
            fi
          done

      - name: Trigger classicy-web deploy
        if: steps.bump_version.outputs.newTag != ''
        env:
          GH_TOKEN: ${{ secrets.CLASSICY_WEB_DISPATCH_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/robbiebyrd/classicy-web/dispatches \
            -f event_type="deploy-pages" \
            -f "client_payload[tag]=${{ steps.bump_version.outputs.newTag }}"

      # Mint a short-lived, repo-scoped token from the "classicy dispatch" GitHub
      # App (installed on Keeping-History/rt911 with Contents: write) so the next
      # step can POST a repository_dispatch across the org boundary. No PAT to
      # rotate — the token dies with the job.
      - name: Mint rt911 dispatch token
        if: steps.bump_version.outputs.newTag != ''
        id: rt911-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RT911_DISPATCH_APP_ID }}
          private-key: ${{ secrets.RT911_DISPATCH_APP_PRIVATE_KEY }}
          owner: Keeping-History
          repositories: rt911

      - name: Trigger rt911 classicy bump
        if: steps.bump_version.outputs.newTag != ''
        env:
          GH_TOKEN: ${{ steps.rt911-token.outputs.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/Keeping-History/rt911/dispatches \
            -f event_type="classicy-published" \
            -f "client_payload[tag]=${{ steps.bump_version.outputs.newTag }}"
