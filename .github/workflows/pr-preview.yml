name: PR Preview

# Builds a full preview of each pull request — the example desktop app at the
# root and Storybook under /storybook — and publishes it to the gh-pages branch
# under pr-preview/pr-<number>/, so reviewers get a live URL to click through the
# changes. The preview is removed automatically when the PR is closed/merged.
#
# Requires: Settings → Pages → Source = "Deploy from a branch", branch "gh-pages"
# (/ root). The main site (pages.yml) deploys to the same branch's root and keeps
# the pr-preview/ directory intact.
#
# Classicy's assets are base-relative already (wallpapers inline as data: URIs,
# icons/wallpapers come from import.meta.glob, sounds from
# new URL(..., import.meta.url)), so building the example app and Storybook with
# the preview sub-path as their base is enough for the full desktop — wallpaper,
# icons and sounds included — to render under pr-preview/pr-<N>/.
#
# Note: previews from FORKED repositories are skipped — a fork's token cannot
# push to gh-pages. Previews work for branches pushed to this repository.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

# Served at <pages-root>/pr-preview/pr-<N>/. If this repo's Pages uses a custom
# domain served at the ROOT, change this to /pr-preview/pr-${{ github.event.number }}/.
env:
  BASE_PATH: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/

jobs:
  preview:
    runs-on: ubuntu-latest
    # Skip previews for pull requests opened from a fork (no write access to the
    # gh-pages branch); same-repo branches build normally.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: github.event.action != 'closed'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install FFMpeg
        if: github.event.action != 'closed'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile

      - name: Build library
        if: github.event.action != 'closed'
        run: pnpm build

      - name: Build example app (scoped to the preview sub-path)
        if: github.event.action != 'closed'
        working-directory: example
        run: pnpm exec vite build --base "$BASE_PATH"

      - name: Build Storybook (scoped to the preview sub-path)
        if: github.event.action != 'closed'
        env:
          STORYBOOK_BASE: ${{ env.BASE_PATH }}storybook/
        run: pnpm --filter classicy-storybook build

      - name: Merge Storybook into the preview
        if: github.event.action != 'closed'
        run: |
          mv storybook/storybook-static example/dist/storybook
          cp -r assets/. example/dist/assets/

      - name: Deploy / update / remove the PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: example/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
