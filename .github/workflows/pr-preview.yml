name: PR Preview

# Builds a full preview of each pull request — the example desktop app at the
# preview root and Storybook under /storybook — and serves it at
# https://demo.classicy.ing/pr-preview/pr-<number>/ alongside the live site.
#
# How it fits the Actions-based Pages setup (no Pages-source switch):
#   1. the preview is written into the gh-pages STORE under pr-preview/pr-<N>/
#      (rossjrw/pr-preview-action — it also comments the URL and removes the dir
#      when the PR closes),
#   2. the assembled gh-pages tree (main site at root + all previews) is then
#      published through the same actions/deploy-pages flow as the main site.
# The deploy runs in this same job because GITHUB_TOKEN cannot reliably trigger
# the main deploy workflow.
#
# Previews from FORKED repositories are skipped — a fork's token cannot write to
# gh-pages. Previews work for branches pushed to this repository.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

# Shared with pages.yml so preview and main-site deploys never race on the
# gh-pages store or the github-pages environment.
concurrency:
  group: pages-publish
  cancel-in-progress: false

# Served from the custom domain root, so the preview base is just the sub-path.
env:
  BASE_PATH: /pr-preview/pr-${{ github.event.number }}/

jobs:
  preview:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: github.event.action != 'closed'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install FFMpeg
        if: github.event.action != 'closed'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile

      - name: Build library
        if: github.event.action != 'closed'
        run: pnpm build

      - name: Build example app (scoped to the preview sub-path)
        if: github.event.action != 'closed'
        working-directory: example
        run: pnpm exec vite build --base "$BASE_PATH"

      - name: Build Storybook (scoped to the preview sub-path)
        if: github.event.action != 'closed'
        env:
          STORYBOOK_BASE: ${{ env.BASE_PATH }}storybook/
        run: pnpm --filter classicy-storybook build

      - name: Merge Storybook into the preview
        if: github.event.action != 'closed'
        run: |
          mv storybook/storybook-static example/dist/storybook
          cp -r assets/. example/dist/assets/

      - name: Update the preview in the gh-pages store (and remove it on close)
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: example/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          # Custom domain, so the comment links to demo.classicy.ing/pr-preview/…
          pages-base-url: demo.classicy.ing/

      - name: Checkout the assembled site (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: published

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
