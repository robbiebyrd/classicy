# Dependabot configuration. Reference:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # The pnpm workspace: one pnpm-lock.yaml at the root covers the library and
  # the example/ member ("npm" is Dependabot's ecosystem for npm, Yarn and pnpm).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Security fixes, transitive ones included, arrive as one PR. Named
      # explicitly so they no longer fall back to the repository-level
      # "npm_and_yarn" group.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      npm-development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Majors need a human: open them by hand, not as weekly noise.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
